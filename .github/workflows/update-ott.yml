name: Atualizar OTT360

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-ott:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m src.scrapers.run_ott_nova_terra
      - name: Publicar resultado
        run: |
          git config user.name "Nova Terra Data Bot"
          git config user.email "bot@novaterra.local"
          git add data/processed/ott_nova_terra_aoi.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Atualiza dados OTT360"
          git push