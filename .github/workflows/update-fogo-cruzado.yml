name: Atualizar Fogo Cruzado

on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-data-updates
  cancel-in-progress: false

jobs:
  update-fogo-cruzado:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FOGOCRUZADO_EMAIL: ${{ secrets.FOGOCRUZADO_EMAIL }}
      FOGOCRUZADO_PASSWORD: ${{ secrets.FOGOCRUZADO_PASSWORD }}
      FOGOCRUZADO_INITIAL_DATE: "2026-09-01"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Validar credenciais
        run: test -n "$FOGOCRUZADO_EMAIL" && test -n "$FOGOCRUZADO_PASSWORD"
      - run: python -m src.scrapers.run_nova_terra
      - name: Publicar resultado
        run: |
          git config user.name "Nova Terra Data Bot"
          git config user.email "bot@novaterra.local"
          git add data/processed/occurrences_nova_terra_aoi.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Atualiza dados Fogo Cruzado"
          git pull --rebase origin main
          git push