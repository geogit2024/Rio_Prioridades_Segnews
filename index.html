<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0a0a0a;
    overflow: hidden;
    height: 100%;
  }
  .ticker-wrap {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    overflow: hidden;
    white-space: nowrap;
    box-sizing: border-box;
  }
  .ticker-label {
    flex-shrink: 0;
    background: #b3121c;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: bold;
    font-size: 14px;
    padding: 6px 14px;
    letter-spacing: 0.5px;
    z-index: 2;
  }
  .ticker-track {
    flex: 1;
    overflow: hidden;
    white-space: nowrap;
    position: relative;
  }
  .ticker {
    display: inline-block;
    padding-left: 100%;
    animation: scroll 90s linear infinite;
  }
  .ticker:hover {
    animation-play-state: paused;
  }
  @keyframes scroll {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-100%); }
  }
  .item {
    display: inline-block;
    color: #f2f2f2;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 15px;
    padding-right: 60px;
    text-decoration: none;
  }
  .item:hover {
    text-decoration: underline;
  }
  .item .source {
    color: #ffcc00;
    font-weight: bold;
    margin-right: 6px;
  }
  .item .date {
    color: #999;
    font-size: 12px;
    margin-right: 6px;
  }
</style>
</head>
<body>
  <div class="ticker-wrap">
    <div class="ticker-label">ÚLTIMAS NOTÍCIAS</div>
    <div class="ticker-track">
      <div class="ticker" id="ticker">Carregando notícias...</div>
    </div>
  </div>

  <script>
    const JSON_URL = "https://raw.githubusercontent.com/geogit2024/Rio_Prioridades_Segnews/main/noticias.json";

    function formatDate(iso) {
      try {
        const d = new Date(iso);
        return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) +
               ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      } catch (e) {
        return '';
      }
    }

    function renderNews(items) {
      const ticker = document.getElementById('ticker');
      if (!Array.isArray(items) || items.length === 0) {
        ticker.textContent = 'Nenhuma notícia disponível no momento.';
        return;
      }
      ticker.innerHTML = items.map(n => {
        const title = n.title || '';
        const source = n.source || '';
        const date = n.date ? formatDate(n.date) : '';
        const link = n.link || '#';
        return `<a class="item" href="${link}" target="_blank" rel="noopener noreferrer">
                  <span class="source">${source}</span>
                  <span class="date">${date}</span>
                  ${title}
                </a>`;
      }).join('');
    }

    function loadNews() {
      // aviso protocolo: abrir este arquivo com duplo-clique (file://) bloqueia
      // o fetch para domínios externos no Chrome/Edge — precisa estar em http(s)://
      if (location.protocol === 'file:') {
        document.getElementById('ticker').textContent =
          'Este arquivo precisa ser aberto via http(s):// (GitHub Pages ou um servidor local) — não funciona com duplo clique direto.';
        return;
      }

      fetch(JSON_URL + '?_=' + Date.now(), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store'
      })
        .then(r => {
          if (!r.ok) {
            throw new Error('HTTP ' + r.status + ' ' + r.statusText);
          }
          return r.json();
        })
        .then(renderNews)
        .catch(err => {
          document.getElementById('ticker').textContent =
            'Erro ao carregar notícias: ' + err.message;
          console.error('Falha ao buscar noticias.json:', err);
        });
    }

    loadNews();
    // Atualiza automaticamente a cada 5 minutos, sem recarregar a página
    setInterval(loadNews, 5 * 60 * 1000);
  </script>
</body>
</html>
